<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>Texmorro — Header Preview</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142a46;
      --paper: #f6f4ef;
      --gold: #a68d54;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
    }

    .site-header {
      position: relative;
      z-index: 2;
      min-height: 100px;
      border-bottom: 1px solid rgba(20, 42, 70, 0.12);
      background: var(--paper);
    }

    .site-header::before {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: 132px;
      height: 132px;
      background: url("texmorro-logo.png") center / contain no-repeat;
      content: "";
      opacity: 0.09;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .header-inner {
      display: grid;
      width: min(100% - 64px, 1440px);
      min-height: 100px;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-inline: auto;
    }

    .brand {
      display: inline-flex;
      width: fit-content;
      align-items: center;
    }

    .brand img {
      display: block;
      width: 82px;
      height: 82px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: clamp(22px, 3vw, 46px);
    }

    .navigation-area {
      display: contents;
    }

    .main-nav a,
    .contact-link {
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.045em;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .main-nav a {
      position: relative;
      padding-block: 8px;
      white-space: nowrap;
    }

    .main-nav a::after {
      position: absolute;
      right: 0;
      bottom: 1px;
      left: 0;
      height: 1px;
      background: var(--gold);
      content: "";
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 180ms ease;
    }

    .main-nav a:hover,
    .main-nav a:focus-visible {
      color: var(--gold);
    }

    .main-nav a:hover::after,
    .main-nav a:focus-visible::after {
      transform: scaleX(1);
    }

    .contact-wrap {
      display: flex;
      justify-content: flex-end;
    }

    .contact-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 18px;
      border: 1px solid rgba(20, 42, 70, 0.35);
      white-space: nowrap;
    }

    .contact-link span {
      color: var(--gold);
      font-size: 17px;
      line-height: 1;
      transition: transform 160ms ease;
    }

    .contact-link:hover,
    .contact-link:focus-visible {
      border-color: var(--ink);
      color: var(--gold);
    }

    .contact-link:hover span {
      transform: translateX(3px);
    }

    .menu-toggle,
    .menu-button {
      display: none;
    }

    @media (max-width: 900px) {
      .header-inner {
        width: min(100% - 40px, 1440px);
        grid-template-columns: 1fr auto;
      }

      .main-nav {
        display: none;
        align-items: stretch;
        gap: 0;
      }

      .main-nav a {
        padding: 14px 0;
        border-bottom: 1px solid rgba(20, 42, 70, 0.08);
      }

      .main-nav a::after {
        content: none;
      }

      .contact-wrap {
        display: none;
      }

      .navigation-area {
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        display: none;
        padding: 8px 20px 18px;
        border-bottom: 1px solid rgba(20, 42, 70, 0.12);
        background: var(--paper);
      }

      .menu-toggle:checked ~ .navigation-area {
        display: block;
      }

      .menu-toggle:checked ~ .navigation-area .main-nav {
        display: flex;
        flex-direction: column;
      }

      .menu-button {
        display: inline-flex;
        width: 44px;
        height: 44px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid rgba(20, 42, 70, 0.25);
        cursor: pointer;
      }

      .menu-button span {
        width: 17px;
        height: 1px;
        background: var(--ink);
      }

      .menu-toggle:checked ~ .navigation-area .contact-wrap {
        display: flex;
      }

      .contact-link {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .header-inner {
        width: calc(100% - 32px);
        min-height: 82px;
      }

      .site-header {
        min-height: 82px;
      }

      .brand img {
        width: 70px;
        height: 70px;
      }

      .site-header::before {
        width: 106px;
        height: 106px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Texmorro home">
        <img src="texmorro-logo.png" alt="Texmorro — Textiles for Tomorrow">
      </a>

      <input class="menu-toggle" type="checkbox" id="menu-toggle" aria-label="Toggle navigation">
      <label class="menu-button" for="menu-toggle" aria-hidden="true">
        <span></span><span></span>
      </label>

      <div class="navigation-area">
        <nav class="main-nav" aria-label="Main navigation">
          <a href="brand_services_index.html">Brand Sales</a>
          <a href="services.html">Services</a>
          <a href="how_it_works.html">How It Works</a>
          <a href="about.html">About Us</a>
          <a href="contact.html">Contact</a>
        </nav>

        <div class="contact-wrap">
          <a class="contact-link" href="contact.html">Let’s talk <span aria-hidden="true">&rarr;</span></a>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
