<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3d4a"/>
      <stop offset="0.5" stop-color="#11131a"/>
      <stop offset="1" stop-color="#2b2e3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d28a"/>
      <stop offset="0.45" stop-color="#b8923a"/>
      <stop offset="1" stop-color="#8a6a22"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d3aa8"/>
      <stop offset="1" stop-color="#141c6b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8923a"/>
      <stop offset="1" stop-color="#d9b85c"/>
    </linearGradient>
  </defs>


  <g opacity="1">
  <!-- Icon (left) -->
  <g transform="translate(24,30)">
    <rect x="4" y="4" width="132" height="132" fill="none" stroke="url(#frame)" stroke-width="8"/>
    <polygon points="64,12 128,12 128,128 64,78" fill="url(#gold)"/>
    <polygon points="12,128 64,78 128,128" fill="url(#blue)"/>
    <line x1="64" y1="12" x2="64" y2="78" stroke="#1a1c26" stroke-width="2"/>
  </g>

  <!-- Text (right) -->
  <text x="190" y="108" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="2" fill="url(#word)">TEXMORRO</text>
  <text x="193" y="144" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="0.5" fill="url(#tag)">Textiles for Tomorrow</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
