<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="title description">
  <title id="title">Texmorro — Textiles for Tomorrow</title>
  <desc id="description">Blue and gold Texmorro mark with a light wordmark for dark backgrounds.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3d4a"/>
      <stop offset="0.5" stop-color="#11131a"/>
      <stop offset="1" stop-color="#2b2e3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d98f"/>
      <stop offset="0.45" stop-color="#c5a044"/>
      <stop offset="1" stop-color="#94712a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5369ef"/>
      <stop offset="1" stop-color="#2639b8"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4b459"/>
      <stop offset="1" stop-color="#f0d27c"/>
    </linearGradient>
  </defs>
  <g transform="translate(24,30)">
    <rect x="4" y="4" width="132" height="132" fill="none" stroke="url(#frame)" stroke-width="8"/>
    <polygon points="64,12 128,12 128,128 64,78" fill="url(#gold)"/>
    <polygon points="12,128 64,78 128,128" fill="url(#blue)"/>
    <line x1="64" y1="12" x2="64" y2="78" stroke="#1a1c26" stroke-width="2"/>
  </g>
  <text x="190" y="108" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="2" fill="#f4f1e8">TEXMORRO</text>
  <text x="193" y="144" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="0.5" fill="url(#tag)">Textiles for Tomorrow</text>
</svg>
